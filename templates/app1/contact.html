<!DOCTYPE html>

<html>

<head>


<title>Contact</title>


<!-- Bootstrap CSS -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<!-- CSS -->

<style>

    body {
        background-color: lightgray;
    }


    h1 {
        text-align: center;
        color: black;
    }


    .address-box {
        background-color: lightblue;
        padding: 30px;
        border-radius: 10px;
        height: 100%;
    }


    .contact-box {
        background-color: white;
        padding: 20px;
        border-radius: 10px;
    }


    /* CENTER THE FORM */

    .form-center {
        width:50%;
        margin: auto;
    }


    /* CENTER BUTTON */

    .form-center button {
        display: block;
        margin: auto;
    }


    .map-box {
        margin-top: 40px;
        margin-bottom: 40px;
    }


</style>


</head>

<body>

<!-- MAIN CONTAINER -->

<div class="container">

<!-- PAGE HEADING -->

<h1 class="mt-4 mb-5">
    CONTACT US
</h1>


<!-- ADDRESS + CONTACT FORM -->

<div class="row">


    <!-- LEFT COLUMN -->

    <div class="col-md-6">

        <div class="address-box">

            <h2>OUR ADDRESS</h2>


            <h6>
                <b>ABC High School</b>
            </h6>


            <h6>
                123 School Road,<br>
                Hyderabad,<br>
                Telangana,<br>
                India
            </h6>


            <h6>
                <b>Phone:</b><br>
                +91 9876543210
            </h6>


            <h6>
                <b>Email:</b><br>
                abcschool@gmail.com
            </h6>


        </div>

    </div>


    <!-- RIGHT COLUMN -->

    <div class="col-md-6">

        <div class="contact-box">

            <h2 class="text-center">
                CONTACT FORM
            </h2>


            <!-- CENTERED FORM -->

            <div class="form-center">

                <form method="POST">
                   

                    {% csrf_token %}


                    {{ form.as_p }}


                    <button type="submit" class="btn btn-primary">
                        Submit
                    </button>


                </form>

            </div>


        </div>

    </div>


</div>


<!-- MAP -->

<div class="row">


    <div class="col-md-12">

        <div class="map-box">

            <h2 class="text-center">
                OUR LOCATION
            </h2>


            <iframe
                src="https://www.google.com/maps?q=Hyderabad,Telangana,India&output=embed"
                width="100%"
                height="400"
                style="border:0;"
                allowfullscreen=""
                loading="lazy">
            </iframe>


        </div>

    </div>


</div>

</div>

<!-- Bootstrap JavaScript -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
