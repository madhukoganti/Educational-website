
<!DOCTYPE html>

<html>
<head>
    <title>Parent Registration</title>

    <style>
        body {
            background-color: #eaf4ff;
            font-family: Arial, sans-serif;
        }

        .form-container {
            width: 400px;
            margin: 50px auto;
            padding: 25px;
            background-color: rgba(173, 216, 230, 0.596);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        h2 {
            color: #1565c0;
            margin-bottom: 25px;
        }

        input, textarea, select {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #90caf9;
            border-radius: 6px;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #1565c0;
            outline: none;
        }

        button {
            background-color: #1565c0;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0d47a1;
        }
    </style>
</head>

<body>

    <div class="form-container">

        <center>
            <h2>PARENT REGISTRATION</h2>

            <form method="POST">
                {% csrf_token %}

                {{ forms.as_p }}

                <button type="submit">Submit</button>
            </form>
        </center>

    </div>

</body>
</html>
